<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Queue 本地记录</title>
<style>
:root{color-scheme:light dark;font:15px/1.6 system-ui,"Microsoft YaHei",sans-serif}body{max-width:760px;margin:40px auto;padding:0 24px}h1{font-size:24px}button{font:inherit;padding:7px 12px;cursor:pointer}button:disabled{cursor:wait;opacity:.6}.actions{display:flex;flex-wrap:wrap;gap:12px}li{padding:16px 0;border-bottom:1px solid #8886;list-style:none}ul{padding:0}p{white-space:pre-wrap;overflow-wrap:anywhere}a{color:inherit}#feedback{min-height:24px}#feedback[role=alert]{color:#c65b3e}small{opacity:.7}
</style></head>
<body><h1>Queue 本地记录</h1><p id="usage" role="status">正在读取…</p>
<p>最近移除的消息可在会话中撤销。更早的消息保存在本机归档中，可恢复到原会话队尾；恢复后队列会暂停，核对后再继续。</p>
<div class="actions"><button id="export">导出全部记录</button><button id="archive">将历史记录移入归档</button></div>
<p>导出文件包含待发送文本和归档文本。移入归档可以释放队列存储空间，归档消息仍可在此恢复。</p>
<p id="feedback" role="status"></p><h2>可恢复的归档消息</h2><ul id="records"></ul><button id="more" hidden>加载更多</button>
<script type="module" src="history.js"></script></body></html>
