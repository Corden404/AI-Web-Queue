<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ChatGPT Web Queue</title>
<style>
  :root{color-scheme:light dark;font:13px/1.6 system-ui,"Microsoft YaHei",sans-serif;--bg:light-dark(#fff,#242424);--fg:light-dark(#222,#ededed);--muted:light-dark(#777,#a1a1a1);--line:light-dark(#e9e9e9,#3b3b3b)}
  *{box-sizing:border-box}body{width:296px;padding:20px;margin:0;background:var(--bg);color:var(--fg)}
  h1{font-size:15px;line-height:1.4;font-weight:600;margin:0 0 18px}h1 span{display:block;margin-top:4px;font-size:12px;font-weight:400;color:var(--muted)}
  .setting{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:13px 0;border-block:1px solid var(--line);cursor:pointer}
  input{appearance:none;position:relative;flex:none;width:32px;height:19px;border:0;border-radius:12px;background:light-dark(#ccc,#555);margin:0;cursor:pointer;transition:background .12s}
  input:before{content:"";position:absolute;left:3px;top:3px;width:13px;height:13px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0003;transition:transform .12s}
  input:checked{background:light-dark(#343434,#ddd)}input:checked:before{transform:translateX(13px);background:light-dark(#fff,#242424)}input:focus-visible{outline:2px solid var(--muted);outline-offset:3px}input:disabled{opacity:.45;cursor:default}
  #status,#naming-status{color:var(--muted);margin-top:11px;font-size:12px;min-height:19px}#status[role=alert],#naming-status[role=alert]{color:light-dark(#a04b31,#e4a18c)}
  h2{font-size:13px;font-weight:600;margin:21px 0 10px}button{font:12px system-ui;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;cursor:pointer}button:disabled{opacity:.45;cursor:default}.actions{display:flex;gap:6px;flex-wrap:wrap}#naming-settings{margin-top:12px;width:100%}#chat-title{font-size:12px;margin:9px 0;overflow-wrap:anywhere;color:var(--muted)}
  p{font-size:12px;color:var(--muted);margin:15px 0 0}kbd{font:11px system-ui;border:1px solid var(--line);border-radius:4px;padding:1px 4px;color:var(--fg)}
  @media(prefers-reduced-motion:reduce){input,input:before{transition:none}}
</style></head>
<body><h1>ChatGPT Web Queue<span>后续消息，按顺序发送</span></h1><label class="setting"><span>开启自动排队</span><input id="enabled" aria-label="开启 Queue 自动排队" type="checkbox" role="switch" checked disabled></label><div id="status" role="status">正在读取设置…</div><p>回答未完成时，按 <kbd>Enter</kbd> 加入队列。<br><kbd>Shift</kbd> + <kbd>Enter</kbd> 换行。</p><h2>对话命名</h2><label class="setting"><span>开启自动命名</span><input id="naming-enabled" aria-label="开启自动命名" type="checkbox" role="switch" disabled></label><div id="naming-status" role="status">正在读取命名设置…</div><div id="chat-title"></div><div class="actions"><button id="generate" disabled>重新生成</button><button id="lock" disabled>锁定标题</button><button id="undo" disabled>撤销改名</button></div><button id="naming-settings">命名规则与模型设置</button><p><a href="history.html" target="_blank" rel="noopener">管理本地记录</a></p><script type="module" src="popup.js"></script></body>
</html>
